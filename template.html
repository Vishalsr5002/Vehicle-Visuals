<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      color: #222;
    }
    h1 {
      text-align: center;
      margin-bottom: 10px;
    }
    hr {
      margin-bottom: 20px;
    }
    .container {
      display: flex;
      gap: 20px;
    }
    .left, .right {
      width: 50%;
    }
    img {
      max-width: 100%;
      border-radius: 6px;
    }
    p {
      font-size: 14px;
      line-height: 1.6;
    }
    .footer {
      position: fixed;
      bottom: 10px;
      width: 100%;
      text-align: center;
      font-size: 12px;
      color: #555;
    }
  </style>
</head>
<body>

  <h1>{{title}}</h1>
  <hr />

  <div class="container">
    <div class="left">
      <img src="{{image1}}" />
      <p>{{leftText}}</p>
    </div>

    <div class="right">
      <p>{{rightText}}</p>
      <img src="{{image2}}" />
    </div>
  </div>

  <div class="footer">
     Vehicle Visuals
  </div>

</body>
</html>
